#####################################################################################################
# HANDLER definition
#####################################################################################################

# development handlers
handlers = java.util.logging.ConsoleHandler

# application server handlers
#handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler 

# application server handlers
#handlers = java.util.logging.ConsoleHandler, com.sibvisions.util.log.jdk.FileHandler

#####################################################################################################
# HANDLER configuration
#####################################################################################################

java.util.logging.ConsoleHandler.level = ALL
java.util.logging.ConsoleHandler.formatter = com.sibvisions.util.log.jdk.JdkLineFormatter

java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.pattern = applications.log
java.util.logging.FileHandler.limit = 10000000
java.util.logging.FileHandler.count = 50
java.util.logging.FileHandler.formatter = com.sibvisions.util.log.jdk.JdkLineFormatter

com.sibvisions.util.log.jdk.FileHandler.level = ALL
com.sibvisions.util.log.jdk.FileHandler.pattern = ${catalina.base}/logs/applications.log
com.sibvisions.util.log.jdk.FileHandler.limit = 10000000
com.sibvisions.util.log.jdk.FileHandler.count = 50
com.sibvisions.util.log.jdk.FileHandler.formatter = com.sibvisions.util.log.jdk.JdkLineFormatter

#####################################################################################################
# Package specifig log levels
#####################################################################################################

.level = SEVERE

#com.sibvisions.rjdbc.level = ALL
